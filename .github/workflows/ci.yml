name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew && ./gradlew test bootJar

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - if: always()
        uses: actions/upload-artifact@v7
        with: { name: frontend-test-report, path: frontend/test-report }
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up --build -d
      - name: Wait for the stack
        run: |
          for i in $(seq 1 60); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' -X POST https://localhost:8443/api/auth/login \
              -H 'Content-Type: application/json' -d '{"username":"admin","password":"Test123"}') || true
            [ "$code" = "200" ] && exit 0
            sleep 3
          done
          docker compose logs backend; exit 1
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: e2e/package-lock.json }
      - working-directory: e2e
        run: npm ci && npx playwright install --with-deps chrome
      - working-directory: e2e
        run: npx playwright test
      - working-directory: e2e
        run: node load/load-test.mjs --vus 10 --duration 15
      - if: failure()
        uses: actions/upload-artifact@v7
        with: { name: playwright-report, path: e2e/playwright-report }
      - if: always()
        run: docker compose down
