# One-command demo:  docker compose up --build   ->  https://localhost:8443  (http://localhost:8080 redirects)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: callqa
      POSTGRES_USER: callqa
      POSTGRES_PASSWORD: callqa
    ports: ["127.0.0.1:5432:5432"]   # local tools only; never exposed on the network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callqa -d callqa"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/callqa
      DB_USER: callqa
      DB_PASSWORD: callqa
    depends_on:
      db:
        condition: service_healthy
    # No published port: the API is reachable only through nginx over HTTPS.

  frontend:
    build: ./frontend
    depends_on: [backend]
    environment:
      PUBLIC_HTTPS_PORT: "8443"   # host port in the HTTP -> HTTPS redirect
    ports: ["8080:80", "8443:443"]
    # Real certificate: mount it instead of the generated self-signed one.
    # volumes: ["./certs:/etc/nginx/certs:ro"]   # tls.crt + tls.key
